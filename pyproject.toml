[project]
name = "sift"
version = "0.1.0"
description = "SIFT API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "pydantic-settings>=2.10.0",
    "nltk",
    "beautifulsoup4",
    "tqdm",
    "lxml",
    "requests",
    "psycopg[binary,pool]>=3.3.6",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.28.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
