  <line x1="11" y1="12" x2="21" y2="20" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="20" x2="11" y2="24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Nodes forming the 'S' -->
  <circle cx="20" cy="8" r="3.5" fill="#A855F7"/>
  <circle cx="11" cy="12" r="3" fill="#34D399"/>
  <circle cx="21" cy="20" r="3.5" fill="#FBBF24"/>
