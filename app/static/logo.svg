<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SIFT">
  <!-- Secondary cluster accent node -->
  <circle cx="25" cy="8" r="2" fill="#8B5CF6" opacity="0.6"/>
  <line x1="20" y1="8" x2="25" y2="8" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Main 'S' path connections -->
